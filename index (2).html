// ==================== СОХРАНЕНИЕ ====================
// ============================================================
const SAVE_KEY = 'bloxy_v3';
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return {
      robux: s.robux || 0, coins: s.coins || 0,
      totalEarned: s.totalEarned || 0,
      ownedAccessories: s.ownedAccessories || [],
      equipped: s.equipped || {},
      lastDaily: s.lastDaily || 0,
      lastPassive: s.lastPassive || Date.now(),
      lastVisit: s.lastVisit || 0,
      streak: s.streak || 0,
      gamesPlayed: s.gamesPlayed || 0,
      records: s.records || {}
    };
  } catch {
    return {
      robux: 500, coins: 0, totalEarned: 500,
      ownedAccessories: [], equipped: {},
      lastDaily: 0, lastPassive: Date.now(),
      lastVisit: 0, streak: 0, gamesPlayed: 0, records: {}
    };
  }
}
function saveGame() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
let save = loadSave();
const now = Date.now();
const dayMs = 24 * 60 * 60 * 1000;
const daysSinceVisit = Math.floor((now - save.lastVisit) / dayMs);
if (save.lastVisit === 0) { save.robux = 500; save.lastDaily = 0; }
else if (daysSinceVisit > 1) save.streak = 0;
save.lastVisit = now;
saveGame();

// ============================================================
// ==================== ПАССИВНЫЙ ДОХОД ====================
// ============================================================
setInterval(() => {
  const elapsed = Date.now() - save.lastPassive;
  if (elapsed >= 60000) {
    const ticks = Math.floor(elapsed / 60000);
    save.robux += 100 * ticks;
    save.totalEarned += 100 * ticks;
    save.lastPassive += 60000 * ticks;
    saveGame(); updateUI();
    showToast('+100 R$ (пассивный доход)', 'info');
  }
}, 1000);
setInterval(() => {
  const left = Math.max(0, 60 - Math.floor((Date.now() - save.lastPassive) / 1000));
  const el = document.getElementById('passive-timer');
  if (el) el.textContent = `следующее: ${left}с`;
}, 500);

// ============================================================
// ==================== ЕЖЕДНЕВКА ====================
// ============================================================
function canClaimDaily() { return Date.now() - save.lastDaily >= dayMs; }
function claimDaily() {
  if (!canClaimDaily()) { showToast('Уже забрано сегодня!', 'error'); return; }
  save.streak = (save.streak || 0) + 1;
  const reward = 500 + Math.min(save.streak * 100, 500);
  save.robux += reward; save.totalEarned += reward;
  save.lastDaily = Date.now(); saveGame();
  showToast(`🎁 +${reward} R$! Серия: ${save.streak} дн.`, 'info');
  updateUI(); updateDailyUI();
}
function updateDailyUI() {
  const btn = document.getElementById('daily-btn');
  const amountEl = document.getElementById('daily-amount');
  const timerEl = document.getElementById('daily-timer');
  if (canClaimDaily()) {
    btn.disabled = false; btn.textContent = 'Забрать';
    amountEl.textContent = 500 + Math.min((save.streak + 1) * 100, 500);
    timerEl.textContent = '';
  } else {
    btn.disabled = true; btn.textContent = 'Уже забрано';
    const left = dayMs - (Date.now() - save.lastDaily);
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    timerEl.textContent = `Через: ${h}ч ${m}м`;
  }
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, masterGain = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new AudioCtx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;
    masterGain.connect(audioCtx.destination);
  } catch(e) {}
}
function playTone(freq, duration, type = 'sine', volume = 0.3, slideTo = null) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function cleanupScene() {
  // Удаляем все объекты из gameRoot
  while (gameRoot.children.length > 0) {
    const child = gameRoot.children[0];
    gameRoot.remove(child);
    disposeObject(child);
  }

  // Сбрасываем ссылки
  levelGroup = null;
  flappyGroup = null;
  walls = [];
  coins = [];
  enemies = [];
  totalCoins = 0;

  // Скрываем персонажа (для Flappy)
  player.visible = false;
  if (player.parent) player.parent.remove(player);

  // Убираем flappy обработчики
  if (flappyKeyHandler) {
    document.removeEventListener('keydown', flappyKeyHandler);
    flappyKeyHandler = null;
  }
  if (flappyClickHandler) {
    renderer.domElement.removeEventListener('click', flappyClickHandler);
    flappyClickHandler = null;
  }

  // Сбрасываем фон и туман
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = null;
}

function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) {
        child.material.forEach(m => m.dispose && m.dispose());
      } else {
        child.material.dispose && child.material.dispose();
      }
    }
  });
}

function makeBrickTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c2571a';
  ctx.fillRect(0, 0, 128, 128);
  const bw = 32, bh = 16;
  for (let y = 0; y < 128; y += bh) {
    const offset = (Math.floor(y / bh) % 2) * (bw / 2);
    for (let x = -bw; x < 128 + bw; x += bw) {
      ctx.fillStyle = `hsl(${20 + Math.random() * 10}, 65%, ${45 + Math.random() * 10}%)`;
      ctx.fillRect(x + offset + 1, y + 1, bw - 2, bh - 2);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeGrassTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = `hsl(${100 + Math.random() * 40 - 20}, 60%, ${35 + Math.random() * 15}%)`;
    ctx.fillRect(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 3, 2 + Math.random() * 3);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20);
  return tex;
}

  armL.add(createCapsule(0.22, 1.2, darkMat)); armL.position.set(-0.8, 2.2, 0); group.add(armL);
  const armR = new THREE.Group();
  armR.add(createCapsule(0.22, 1.2, darkMat)); armR.position.set(0.8, 2.2, 0); group.add(armR);
  const legL = new THREE.Group();
  legL.add(createCapsule(0.24, 1.2, darkMat)); legL.position.set(-0.35, 1.3, 0); group.add(legL);
  const legR = new THREE.Group();
  legR.add(createCapsule(0.24, 1.2, darkMat)); legR.position.set(0.35, 1.3, 0); group.add(legR);
  group.position.set(x, 0, z);
  const diffMult = state.difficulty === 'easy' ? 0.8 : state.difficulty === 'normal' ? 1 : 1.3;
  return {
    group, startX: x, startZ: z,
    dir: Math.random() > 0.5 ? 0 : Math.PI,
    speed: 2.2 * diffMult,
    detectionRange: 12 * diffMult,
    state: 'patrol', searchTimer: 0,
    lastSeenX: x, lastSeenZ: z, walkPhase: 0,
    parts: { armL, armR, legL, legR }
  };
}

function buildLevel(mapData) {
  // ЧИСТИМ ПЕРЕД ПОСТРОЙКОЙ
  clearGameObjectsOnly();

  // Создаём levelGroup внутри gameRoot
  levelGroup = new THREE.Group();
  gameRoot.add(levelGroup);

  const MAP = mapData;
  const gridH = MAP.length, gridW = MAP[0].length;
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(gridW * TILE + 20, gridH * TILE + 20),
    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  levelGroup.add(ground);

  const spawnEnemies = !(state.mode && state.mode.noEnemies);
  for (let z = 0; z < gridH; z++) {
    for (let x = 0; x < gridW; x++) {
      const ch = MAP[z][x];
      const px = (x - gridW/2) * TILE;
      const pz = (z - gridH/2) * TILE;
      if (ch === '#') {
        const wall = createWall(px, pz);
        levelGroup.add(wall);
        walls.push({ x: px, z: pz, size: TILE });
      } else if (ch === 'C') {
        const coin = createCoin3D(px, 1.2, pz);
        levelGroup.add(coin);
        coins.push({ mesh: coin, collected: false, x: px, z: pz });
        totalCoins++;
      } else if (ch === 'P') {
        playerStart.x = px; playerStart.z = pz;
      } else if (ch === 'E' && spawnEnemies) {
        const enemy = createEnemy3D(px, pz);
        levelGroup.add(enemy.group);
        enemies.push(enemy);
      }
    }
  }
  document.getElementById('score').textContent = '0';
  state.score = 0;

  // Добавляем игрока
  player.visible = true;
  if (!player.parent) gameRoot.add(player);
  player.position.set(playerStart.x, 0, playerStart.z);
  player.rotation.y = 0;
  playerVelocity.set(0, 0, 0);
  velocityY = 0; onGround = true;
  cameraState.yaw = 0;
  cameraState.pitch = 0.25;

  // Восстанавливаем фон для 3D
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 40, 100);
}

// Очищает только объекты игр, не трогая player
function clearGameObjectsOnly() {
  // Удаляем старый levelGroup
  if (levelGroup) {
    gameRoot.remove(levelGroup);
    disposeObject(levelGroup);
    levelGroup = null;
  }
  // Удаляем flappy группу
  if (flappyGroup) {
    gameRoot.remove(flappyGroup);
    disposeObject(flappyGroup);
    flappyGroup = null;
  }
  // Удаляем всех детей gameRoot кроме player
  const toRemove = [];
  gameRoot.children.forEach(child => {
    if (child !== player) toRemove.push(child);
  });
  toRemove.forEach(child => {
    gameRoot.remove(child);
    disposeObject(child);
  });
  walls = []; coins = []; enemies = []; totalCoins = 0;
}

function checkCollision(nx, nz, radius = PLAYER_RADIUS) {
  for (const w of walls) {
    const half = w.size / 2;
    if (nx + radius > w.x - half && nx - radius < w.x + half &&
        nz + radius > w.z - half && nz - radius < w.z + half) return true;
  }
  return false;
}

// ==================== УПРАВЛЕНИЕ ====================
// ============================================================
const cameraState = { yaw: 0, pitch: 0.25, distance: 8, height: 2.5 };
let velocityY = 0, onGround = true, shiftHeld = false;
const keys = {};
let playerVelocity = new THREE.Vector3();

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') shiftHeld = true;
  if (e.code === 'Escape' && state.running && !state.paused) pauseGame();
  else if (e.code === 'Escape' && state.paused) resumeGame();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') shiftHeld = false;
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    cameraState.yaw -= e.movementX * 0.0022;
    cameraState.pitch = Math.max(-0.8, Math.min(1.0, cameraState.pitch + e.movementY * 0.0022));
  }
});
renderer.domElement.addEventListener('click', () => {
  if (state.running && !state.paused && state.mode && state.mode.type === 'three') {
    renderer.domElement.requestPointerLock();
  }
});

let walkPhase = 0;
function updatePlayer(dt) {
  let inputX = 0, inputZ = 0;
  if (keys['KeyW'] || keys['ArrowUp']) inputZ -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) inputZ += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;
  const speed = shiftHeld ? 6.5 : 13;
  const len = Math.hypot(inputX, inputZ);
  let targetVX = 0, targetVZ = 0;
  if (len > 0) {
    inputX /= len; inputZ /= len;
    const sin = Math.sin(cameraState.yaw), cos = Math.cos(cameraState.yaw);
    const dx = inputX * cos - inputZ * sin;
    const dz = inputX * sin + inputZ * cos;
    targetVX = dx * speed; targetVZ = dz * speed;
  }
  const ACCEL = len > 0 ? 20 : 15;
  playerVelocity.x += (targetVX - playerVelocity.x) * Math.min(1, dt * ACCEL);
  playerVelocity.z += (targetVZ - playerVelocity.z) * Math.min(1, dt * ACCEL);

  const nx = player.position.x + playerVelocity.x * dt;
  const nz = player.position.z + playerVelocity.z * dt;
  if (!checkCollision(nx, player.position.z)) player.position.x = nx; else playerVelocity.x = 0;
  if (!checkCollision(player.position.x, nz)) player.position.z = nz; else playerVelocity.z = 0;

  const velLen = Math.hypot(playerVelocity.x, playerVelocity.z);
  if (velLen > 0.5) {
    const targetAngle = Math.atan2(playerVelocity.x, playerVelocity.z);
    let diff = targetAngle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * Math.min(1, dt * 14);
    walkPhase += dt * (shiftHeld ? 8 : 16) * (velLen / speed);
    const swing = Math.sin(walkPhase) * 0.7;
    playerParts.armL.rotation.x = swing; playerParts.armR.rotation.x = -swing;
    playerParts.legL.rotation.x = -swing; playerParts.legR.rotation.x = swing;
  } else {
    playerParts.armL.rotation.x *= 0.85; playerParts.armR.rotation.x *= 0.85;
    playerParts.legL.rotation.x *= 0.85; playerParts.legR.rotation.x *= 0.85;
  }
  if (keys['Space'] && onGround) { velocityY = 12; onGround = false; Sounds.jump(); }
  velocityY -= 32 * dt;
  player.position.y += velocityY * dt;
  if (player.position.y <= 0) { player.position.y = 0; velocityY = 0; onGround = true; }
  if (state.invulnerable > 0) {
    state.invulnerable -= dt;
    player.visible = Math.floor(state.invulnerable * 10) % 2 === 0;
  } else player.visible = true;
}

function hasLineOfSight(from, to) {
  const steps = 12;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = from.x + (to.x - from.x) * t;
    const z = from.z + (to.z - from.z) * t;
    if (checkCollision(x, z, 0.2)) return false;
  }
  return true;
}
function updateEnemies(dt) {
  for (const e of enemies) {
    const dx = player.position.x - e.group.position.x;
    const dz = player.position.z - e.group.position.z;
    const distToPlayer = Math.hypot(dx, dz);
    const canSee = distToPlayer < e.detectionRange && hasLineOfSight(e.group.position, player.position);
    if (canSee) {
      if (e.state !== 'chase') Sounds.enemyAlert();
      e.state = 'chase';
      e.lastSeenX = player.position.x; e.lastSeenZ = player.position.z;
      e.searchTimer = 3;
    } else if (e.state === 'chase') e.state = 'search';

    let targetX, targetZ, speed;
    if (e.state === 'chase') { targetX = player.position.x; targetZ = player.position.z; speed = e.speed * 1.6; }
    else if (e.state === 'search') {
      targetX = e.lastSeenX; targetZ = e.lastSeenZ; speed = e.speed * 1.2;
      e.searchTimer -= dt;
      if (e.searchTimer <= 0 || Math.hypot(targetX - e.group.position.x, targetZ - e.group.position.z) < 1) e.state = 'patrol';
    } else {
      const nx = e.group.position.x + Math.cos(e.dir) * 0.5;
      const nz = e.group.position.z + Math.sin(e.dir) * 0.5;
      if (checkCollision(nx, nz, 0.6) || Math.hypot(e.group.position.x - e.startX, e.group.position.z - e.startZ) > 8) {
        e.dir += Math.PI / 2 + Math.random() * Math.PI;
      }
      targetX = e.group.position.x + Math.cos(e.dir);
      targetZ = e.group.position.z + Math.sin(e.dir);
      speed = e.speed;
    }
    const mdx = targetX - e.group.position.x, mdz = targetZ - e.group.position.z;
    const mlen = Math.hypot(mdx, mdz);
    if (mlen > 0.1) {
      const ndx = mdx / mlen, ndz = mdz / mlen;
      const nx = e.group.position.x + ndx * speed * dt;
      const nz = e.group.position.z + ndz * speed * dt;
      let moved = false;
      if (!checkCollision(nx, e.group.position.z, 0.6)) { e.group.position.x = nx; moved = true; }
      if (!checkCollision(e.group.position.x, nz, 0.6)) { e.group.position.z = nz; moved = true; }
      if (!moved && e.state === 'patrol') e.dir += Math.PI / 2 + Math.random() * Math.PI;
      const targetAngle = Math.atan2(ndx, ndz);
      let diff = targetAngle - e.group.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      e.group.rotation.y += diff * Math.min(1, dt * 10);
      e.walkPhase += dt * 10;
      const swing = Math.sin(e.walkPhase) * 0.6;
      e.parts.armL.rotation.x = swing; e.parts.armR.rotation.x = -swing;
      e.parts.legL.rotation.x = -swing; e.parts.legR.rotation.x = swing;
    }
    if (distToPlayer < 1.5 && state.invulnerable <= 0 && state.running && !state.paused) hitPlayer();
  }
}

function hitPlayer() {
  state.lives--; state.invulnerable = 1.5;
  updateHearts(); Sounds.hurt();
  const flash = document.getElementById('damage-flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 100);
  if (state.lives <= 0) gameOver();
  else {
    player.position.x -= Math.sin(player.rotation.y) * 2;
    player.position.z -= Math.cos(player.rotation.y) * 2;
  }
}

function updateCoins(dt) {
  const t = performance.now() * 0.003;
  for (const c of coins) {
    if (c.collected) continue;
    c.mesh.rotation.z += dt * 3;
    c.mesh.position.y = 1.2 + Math.sin(t + c.x * 0.5) * 0.2;
    const d = Math.hypot(player.position.x - c.x, player.position.z - c.z);
    if (d < 1.5 && Math.abs(player.position.y + 1 - c.mesh.position.y) < 2.5) {
      c.collected = true;
      if (levelGroup) levelGroup.remove(c.mesh);
      state.score++;
      document.getElementById('score').textContent = state.score;
      Sounds.coin();
      if (state.score === totalCoins) levelComplete();
    }
  }
}

function updateCamera(dt) {
  const focusY = player.position.y + cameraState.height;
  const cosP = Math.cos(cameraState.pitch), sinP = Math.sin(cameraState.pitch);
  camera.position.set(
    player.position.x + Math.sin(cameraState.yaw) * cameraState.distance * cosP,
    focusY + sinP * cameraState.distance,
    player.position.z + Math.cos(cameraState.yaw) * cameraState.distance * cosP
  );
  camera.lookAt(player.position.x, focusY, player.position.z);
}

function updateHearts() {
  const el = document.getElementById('hearts');
  if (el) el.innerHTML = '❤'.repeat(Math.max(0, state.lives)) + '🖤'.repeat(Math.max(0, state.maxLives - state.lives));
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}
let timerInterval = null;
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  state.levelStartTime = Date.now();
  timerInterval = setInterval(() => {
    if (!state.running || state.paused) return;
    const elapsed = (Date.now() - state.levelStartTime) / 1000;
    document.getElementById('timer').textContent = formatTime(elapsed);
    if (state.timeLimit && elapsed >= state.timeLimit) gameOver();
  }, 100);
}

function flappyJump() {

function createPipe(y, h) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(2, h, 2), flappy.pipeMat);
  m.castShadow = true;
  m.userData.h = h;
  return m;
}

function updateFlappy(dt) {
  if (!flappy || !state.running || state.paused) return;
  flappy.vy -= 22 * dt;
  flappy.y += flappy.vy * dt;
  flappy.birdGroup.position.y = flappy.y;
  flappy.birdGroup.rotation.z = -flappy.vy * 0.05;

  if (flappy.y > 28) { flappy.y = 28; flappy.vy = 0; }
  if (flappy.y < -2) { gameOver(); return; }

  flappy.spawnTimer -= dt;
  if (flappy.spawnTimer <= 0) {
    flappy.spawnTimer = 1.5;
    const gap = 6;
    const centerY = 8 + Math.random() * 8;
    const pipeTop = createPipe(0, 15);
    const pipeBot = createPipe(0, 15);
    pipeTop.position.set(20, centerY + gap/2 + 7.5, 0);
    pipeBot.position.set(20, centerY - gap/2 - 7.5, 0);
    flappyGroup.add(pipeTop); flappyGroup.add(pipeBot);
    flappy.pipes.push({ top: pipeTop, bot: pipeBot, x: 20, centerY, scored: false });
  }

  flappy.pipes.forEach(p => {
    p.x -= 8 * dt;
    p.top.position.x = p.x;
    p.bot.position.x = p.x;
    const bx = flappy.birdGroup.position.x;
    const by = flappy.y;
    if (bx + 0.5 > p.x - 1 && bx - 0.5 < p.x + 1) {
      if (by + 0.5 > p.centerY + 3 || by - 0.5 < p.centerY - 3) {
        gameOver();
      }
    }
    if (!p.scored && p.x < bx - 1) {
      p.scored = true;
      flappy.score++;
      document.getElementById('score').textContent = flappy.score;
      Sounds.coin();
      if (flappy.score >= 15) winGame(flappy.score * 20);
    }
  });

  flappy.pipes = flappy.pipes.filter(p => {
    if (p.x < -25) {
      flappyGroup.remove(p.top); flappyGroup.remove(p.bot);
      disposeObject(p.top); disposeObject(p.bot);
      return false;
    }
    return true;
  });
}

let simonSequence = [], simonPlayerIndex = 0, simonRound = 0;

function startSimon() {
  cleanupScene();
  renderer.domElement.style.display = 'none';

    <div class="simon-grid">

    </div>
  `;

  ui.querySelectorAll('.simon-btn').forEach(btn => {

  });

}
function simonNextRound() {
  if (!state.running) return;
  simonRound++;
  document.getElementById('score').textContent = simonRound - 1;
  simonSequence.push(Math.floor(Math.random() * 4));
  simonPlayerIndex = 0;
  simonAcceptingInput = false;
  const speed = Math.max(300, 800 - simonRound * 30);
  simonSequence.forEach((color, i) => {
    simonTimeouts.push(setTimeout(() => {
      Sounds.simon(color);
      simonLightUp(color, speed * 0.6);
    }, i * speed));
  });
  simonTimeouts.push(setTimeout(() => { simonAcceptingInput = true; }, simonSequence.length * speed + 300));
}
function simonLightUp(color, dur) {
  const btn = document.querySelector(`.simon-btn[data-color="${color}"]`);
  if (!btn) return;
  btn.classList.add('lit');
  setTimeout(() => btn.classList.remove('lit'), dur);
}
function simonPlayerClick(color) {
  if (!simonAcceptingInput || !state.running) return;
  Sounds.simon(color);
  simonLightUp(color, 200);
  if (color !== simonSequence[simonPlayerIndex]) {
    Sounds.wrong();
    simonAcceptingInput = false;
    setTimeout(() => winGame((simonRound - 1) * 30), 500);
    return;
  }
  simonPlayerIndex++;
  if (simonPlayerIndex >= simonSequence.length) {
    simonAcceptingInput = false;
    Sounds.correct();
    if (simonRound >= 15) setTimeout(() => winGame(simonRound * 50), 300);
    else simonTimeouts.push(setTimeout(simonNextRound, 800));
  }
}

function tttClick(i) {
  if (!tttPlayerTurn || tttGameOver || tttBoard[i]) return;
  tttBoard[i] = 'X'; renderTtt(); Sounds.click();
  if (checkTttWin('X')) { tttEnd('X'); return; }
  if (tttBoard.every(c => c)) { tttEnd('draw'); return; }
  tttPlayerTurn = false;
  setTimeout(tttAI, 400);
}
function tttAI() {
  if (tttGameOver) return;
  const empty = tttBoard.map((c, i) => c === '' ? i : -1).filter(i => i >= 0);
  for (const i of empty) { tttBoard[i] = 'O'; if (checkTttWin('O')) { renderTtt(); tttEnd('O'); return; } tttBoard[i] = ''; }
  for (const i of empty) { tttBoard[i] = 'X'; if (checkTttWin('X')) { tttBoard[i] = 'O'; renderTtt(); Sounds.click(); tttPlayerTurn = true; return; } tttBoard[i] = ''; }
  let move;
  if (tttBoard[4] === '') move = 4;
  else {
    const corners = [0, 2, 6, 8].filter(i => tttBoard[i] === '');
    move = corners.length ? corners[Math.floor(Math.random() * corners.length)] : empty[Math.floor(Math.random() * empty.length)];
  }
  tttBoard[move] = 'O'; renderTtt(); Sounds.click();
  if (checkTttWin('O')) { tttEnd('O'); return; }
  if (tttBoard.every(c => c)) { tttEnd('draw'); return; }
  tttPlayerTurn = true;
}
function checkTttWin(p) {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return lines.some(([a,b,c]) => tttBoard[a]===p && tttBoard[b]===p && tttBoard[c]===p);
}
function renderTtt() {
  document.querySelectorAll('.ttt-cell').forEach((cell, i) => {
    cell.textContent = tttBoard[i];
    cell.className = 'ttt-cell' + (tttBoard[i] === 'X' ? ' x' : tttBoard[i] === 'O' ? ' o' : '');
  });
}
function tttEnd(winner) {
  tttGameOver = true;
  setTimeout(() => {
    if (winner === 'X') winGame(100);
    else if (winner === 'O') { state.score = 0; gameOver(); }
    else winGame(30);
  }, 800);
}

let memoryCards = [], memoryFlipped = [], memoryMatched = [], memoryLocked = false;
function startMemory() {
  cleanupScene();
  renderer.domElement.style.display = 'none';
  const emojis = ['🍎','🍌','🍇','🍓','🍊','🥝','🍒','🍉'];
  memoryCards = [...emojis, ...emojis].map((e, i) => ({ id: i, emoji: e, flipped: false, matched: false }));
  memoryCards.sort(() => Math.random() - 0.5);
  memoryFlipped = []; memoryMatched = []; memoryLocked = false;

  const ui = document.getElementById('simon-ui');
  ui.innerHTML = `<div style="display:grid; grid-template-columns: repeat(4, 100px); gap:12px; pointer-events:auto;">
    ${memoryCards.map((c, i) => `<div class="ttt-cell" data-i="${i}" style="font-size:36px; cursor:pointer; background:rgba(0,0,0,0.5);">❓</div>`).join('')}
  </div>`;
  ui.classList.add('active');
  ui.querySelectorAll('.ttt-cell').forEach(cell => {
    cell.onclick = () => memoryClick(parseInt(cell.dataset.i));
  });
  document.getElementById('score-label').textContent = 'Пары:';
  document.getElementById('score').textContent = '0';
  document.getElementById('hearts').innerHTML = '❤❤❤';
  state.running = true; state.paused = false;
  startTimer();
}
function memoryClick(i) {
  if (memoryLocked) return;
  const card = memoryCards[i];
  if (card.flipped || card.matched) return;
  card.flipped = true;
  const cell = document.querySelector(`.ttt-cell[data-i="${i}"]`);
  cell.textContent = card.emoji;
  cell.style.background = 'rgba(0,162,255,0.2)';
  Sounds.click();
  memoryFlipped.push(i);
  if (memoryFlipped.length === 2) {
    memoryLocked = true;
    const [a, b] = memoryFlipped;
    setTimeout(() => {
      if (memoryCards[a].emoji === memoryCards[b].emoji) {
        memoryCards[a].matched = true; memoryCards[b].matched = true;
        memoryMatched.push(a, b);
        state.score++;
        document.getElementById('score').textContent = state.score;
        Sounds.correct();
        document.querySelector(`.ttt-cell[data-i="${a}"]`).style.background = 'rgba(0,176,107,0.3)';
        document.querySelector(`.ttt-cell[data-i="${b}"]`).style.background = 'rgba(0,176,107,0.3)';
        if (memoryMatched.length === memoryCards.length) setTimeout(() => winGame(150), 500);
      } else {
        memoryCards[a].flipped = false; memoryCards[b].flipped = false;
        document.querySelector(`.ttt-cell[data-i="${a}"]`).textContent = '❓';
        document.querySelector(`.ttt-cell[data-i="${b}"]`).textContent = '❓';
        document.querySelector(`.ttt-cell[data-i="${a}"]`).style.background = 'rgba(0,0,0,0.5)';
        document.querySelector(`.ttt-cell[data-i="${b}"]`).style.background = 'rgba(0,0,0,0.5)';
        Sounds.wrong();
        state.lives--;
        updateHearts();
        if (state.lives <= 0) { gameOver(); return; }
      }
      memoryFlipped = []; memoryLocked = false;
    }, 700);
  }
}

function winGame(finalScore) {
  state.running = false;
  Sounds.win();
  document.exitPointerLock();
  const score = finalScore !== undefined ? finalScore : state.score;
  const diffMult = { easy: 1, normal: 2, hard: 3 }[state.difficulty];
  const reward = Math.floor((state.mode.rewardBase * diffMult) + score * 10);

  save.robux += reward;
  save.totalEarned += reward;
  save.coins += score;
  save.gamesPlayed++;
  saveGame(); updateUI();

  document.getElementById('win-score').textContent = score;
  const elapsed = (Date.now() - state.levelStartTime) / 1000;
  document.getElementById('win-time').textContent = formatTime(elapsed);
  document.getElementById('win-robux').textContent = reward;
  document.getElementById('win-screen').classList.add('active');

  const board = JSON.parse(localStorage.getItem('bloxy_leaderboard') || '[]');
  board.push({ name: 'Ты', game: state.mode.name, score, time: elapsed, date: Date.now() });
  board.sort((a, b) => b.score - a.score);
  board.splice(20);
  localStorage.setItem('bloxy_leaderboard', JSON.stringify(board));
}

function gameOver() {
  state.running = false;
  Sounds.lose();
  document.exitPointerLock();
  const diffMult = { easy: 1, normal: 2, hard: 3 }[state.difficulty];
  const reward = Math.floor(state.mode.rewardBase * diffMult * 0.2 + state.score * 3);
  save.robux += reward;
  save.totalEarned += reward;
  save.gamesPlayed++;
  saveGame(); updateUI();

  document.getElementById('lose-score').textContent = state.score;
  document.getElementById('lose-robux').textContent = reward;
  document.getElementById('lose-screen').classList.add('active');
}

function pauseGame() {
  state.paused = true;
  document.getElementById('pause-menu').classList.add('active');
  document.exitPointerLock();
}
function resumeGame() {
  state.paused = false;
  document.getElementById('pause-menu').classList.remove('active');
  if (state.mode.type === 'three') renderer.domElement.requestPointerLock();
}
function restartLevel() {
  document.getElementById('pause-menu').classList.remove('active');
  document.getElementById('lose-screen').classList.remove('active');
  document.getElementById('win-screen').classList.remove('active');
  state.score = 0;
  state.lives = state.mode.lives || 3;
  state.maxLives = state.mode.lives || 3;
  startGame(state.mode);
}

function exitToMenu() {
  state.running = false;
  state.paused = false;
  document.exitPointerLock();

  // ПОЛНАЯ ОЧИСТКА
  cleanupScene();

  renderer.domElement.style.display = 'none';
  document.getElementById('main-menu').classList.remove('hidden');
  document.getElementById('game-ui').classList.remove('active');
  document.getElementById('exit-btn').classList.remove('active');
  document.getElementById('pause-menu').classList.remove('active');
  document.getElementById('win-screen').classList.remove('active');
  document.getElementById('lose-screen').classList.remove('active');
  document.getElementById('simon-ui').classList.remove('active');
  document.getElementById('tictactoe-ui').classList.remove('active');
  document.getElementById('flappy-ui').classList.remove('active');

  if (simonTimeouts) simonTimeouts.forEach(t => clearTimeout(t));
  simonTimeouts = [];

  renderGamesGrid();
  updateUI();
}

function initViewer() {
  if (viewerRenderer) return;

  viewerScene.add(new THREE.AmbientLight(0xffffff, 0.7));

  key.shadow.camera.left = -10; key.shadow.camera.right = 10;

  );

    new THREE.TorusGeometry(2.4, 0.05, 8, 60),

  const wrap = document.getElementById('viewer-canvas-wrap');

  wrap.addEventListener('mousemove', (e) => {
    if (!viewerRotating) return;
    viewerRotation.y -= (e.clientX - viewerLastX) * 0.01;
    viewerRotation.x += (e.clientY - viewerLastY) * 0.01;
    viewerRotation.x = Math.max(-1.2, Math.min(0.5, viewerRotation.x));

  wrap.addEventListener('mouseup', () => viewerRotating = false);
  wrap.addEventListener('mouseleave', () => viewerRotating = false);
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    viewerDistance = Math.max(4, Math.min(15, viewerDistance + e.deltaY * 0.01));
  }, { passive: false });

function applyViewerAccessories() {
  Object.values(viewerEquipped).forEach(g => viewerPlayer.remove(g));
  viewerEquipped = {};
  Object.entries(save.equipped).forEach(([slot, accId]) => {
    const acc = ACCESSORIES.find(a => a.id === accId);
    if (!acc) return;
    const g = acc.build(acc);
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    viewerPlayer.add(g);
    viewerEquipped[slot] = g;
  });
}

let currentViewerSlot = 'all';
function renderViewerAccessories(slot = 'all') {
  const container = document.getElementById('viewer-accessories');
  container.innerHTML = '';
  const list = slot === 'all' ? ACCESSORIES : ACCESSORIES.filter(a => a.slot === slot);
  list.forEach(acc => {
    const owned = save.ownedAccessories.includes(acc.id);
    const equipped = save.equipped[acc.slot] === acc.id;
    const card = document.createElement('div');
    card.className = 'viewer-acc-card';
    if (owned) card.classList.add('owned');
    if (equipped) card.classList.add('equipped');
    let priceHtml = '';
    if (equipped) priceHtml = '<div class="viewer-acc-price equipped-text">✓ Надето</div>';
    else if (owned) priceHtml = '<div class="viewer-acc-price owned-text">✓ Куплено</div>';
    else priceHtml = `<div class="viewer-acc-price"><span class="coin-icon" style="width:10px;height:10px;display:inline-block;"></span> ${acc.price} R$</div>`;
    let badgeHtml = '';
    if (equipped) badgeHtml = '<div class="viewer-acc-badge equipped-badge">✓</div>';
    else if (owned) badgeHtml = '<div class="viewer-acc-badge">✓</div>';
    card.innerHTML = `
      ${badgeHtml}
      <span class="viewer-acc-emoji">${acc.emoji}</span>
      <div class="viewer-acc-name">${acc.name}</div>
      ${priceHtml}`;
    card.onclick = () => buyOrEquipAcc(acc.id);
    container.appendChild(card);
  });
}

function buyOrEquipAcc(id) {
  const acc = ACCESSORIES.find(a => a.id === id);
  if (!acc) return;
  const owned = save.ownedAccessories.includes(id);
  const currentlyEquipped = save.equipped[acc.slot] === id;
  if (owned) {
    if (currentlyEquipped) { delete save.equipped[acc.slot]; showToast(`Снято: ${acc.name}`, 'info'); }
    else { save.equipped[acc.slot] = id; showToast(`Надето: ${acc.name}`, 'info'); }
    Sounds.click(); saveGame();
    applyViewerAccessories();
    if (player.parent) applyEquippedAccessories();
    renderViewerAccessories(currentViewerSlot);
    updateUI();
    return;
  }
  if (save.robux < acc.price) {
    showToast(`Не хватает ${acc.price - save.robux} R$!`, 'error');
    Sounds.wrong(); return;
  }
  save.robux -= acc.price;
  save.ownedAccessories.push(id);
  save.equipped[acc.slot] = id;
  saveGame();
  showToast(`Куплено: ${acc.name}!`, 'info');
  Sounds.correct();
  applyViewerAccessories();
  if (player.parent) applyEquippedAccessories();
  renderViewerAccessories(currentViewerSlot);
  updateUI();
}

function viewerAnimate() {
  if (!viewerRenderer) return;
  viewerAnimId = requestAnimationFrame(viewerAnimate);
  const wrap = document.getElementById('viewer-canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (viewerRenderer.domElement.width !== w || viewerRenderer.domElement.height !== h) {
    viewerRenderer.setSize(w, h, false);
    viewerCamera.aspect = w / h;
    viewerCamera.updateProjectionMatrix();
  }
  const cy = 2.5 + Math.sin(viewerRotation.x) * viewerDistance * 0.5;
  const cd = Math.cos(viewerRotation.x) * viewerDistance;
  viewerCamera.position.set(Math.sin(viewerRotation.y) * cd, cy, Math.cos(viewerRotation.y) * cd);
  viewerCamera.lookAt(0, 2, 0);
  const t = performance.now() * 0.001;
  if (viewerPlayer) viewerPlayer.rotation.y = Math.sin(t * 0.5) * 0.1;
  viewerRenderer.render(viewerScene, viewerCamera);
}

function openCharacterViewer() {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('character-viewer').classList.add('active');
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelector('[data-tab="character"]').classList.add('active');
  setTimeout(() => {
    initViewer();
    applyViewerAccessories();
    renderViewerAccessories('all');
    if (!viewerAnimId) viewerAnimate();
  }, 50);
}
function closeCharacterViewer() {
  document.getElementById('character-viewer').classList.remove('active');
  document.getElementById('main-menu').classList.remove('hidden');
  if (viewerAnimId) cancelAnimationFrame(viewerAnimId);
  viewerAnimId = null;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelector('[data-tab="games"]').classList.add('active');
}
document.querySelectorAll('.viewer-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.viewer-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentViewerSlot = tab.dataset.slot;
    renderViewerAccessories(currentViewerSlot);
  });
});

// ============================================================
// ==================== ГЛАВНЫЙ ЦИКЛ ====================
// ============================================================
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (state.running && !state.paused && state.mode) {
    if (state.mode.type === 'three') {
      updatePlayer(dt);
      updateEnemies(dt);
      updateCoins(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    } else if (state.mode.type === 'flappy') {
      updateFlappy(dt);
      renderer.render(scene, camera);
    }
  } else if (renderer.domElement.style.display !== 'none' && state.mode) {
    // Пауза — рендерим статично
    if (state.mode.type === 'three') updateCamera(dt);
    renderer.render(scene, camera);
  }
}

// ============================================================
// ==================== СТАРТ ====================
// ============================================================
renderGamesGrid();
updateUI();
updateDailyUI();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
animate();
</script>
